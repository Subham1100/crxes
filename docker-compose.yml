services:
  postgres:
    image: postgres:16-alpine
    container_name: crxes-postgres
    environment:
      POSTGRES_USER: crxes
      POSTGRES_PASSWORD: crxes
      POSTGRES_DB: crxes
    # Host port 5433 — 5432 is taken by another local project.
    ports:
      - "5433:5432"
    volumes:
      - crxes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crxes -d crxes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crxes-redis
    # Host port 6380 — 6379 is taken by another local project.
    ports:
      - "6380:6379"
    volumes:
      - crxes-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: crxes-backend
    env_file: ./backend/.env
    environment:
      # Inside the compose network services talk on their real ports, not the
      # shifted host ports — these override the localhost values in .env.
      DATABASE_URL: postgresql+asyncpg://crxes:crxes@postgres:5432/crxes
      REDIS_URL: redis://redis:6379/0
      # The frontend is not containerized — it runs on the host in dev and on
      # Vercel in production — so it reaches the API through the published port
      # like any other browser client. Add the Vercel origin here when deploying.
      CORS_ORIGINS: http://localhost:3001
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      # Anonymous volume: keeps the macOS .venv from shadowing the container's
      # system-python install, which is where the deps actually live.
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8001/api/health/"]
      interval: 5s
      timeout: 5s
      # Generous: the first boot waits on `alembic upgrade head` before serving.
      retries: 30
      start_period: 10s

volumes:
  crxes-pgdata:
  crxes-redisdata:
